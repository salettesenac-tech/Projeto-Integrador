<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Edite suas informações no VivaLíngua.">

  <meta name="theme-color" content="#476E63">

  <title>VivaLíngua | Editar perfil</title>


  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <link rel="preconnect" href="https://fonts.googleapis.com">


  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet">


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">


  <link rel="stylesheet" href="../css/style.css">

</head>


<body data-page="editar">

  <a class="skip-link" href="#conteudo">
    Pular para o conteúdo
  </a>


  <!-- =========================
       NAVBAR
  ========================== -->

  <nav
    class="navbar navbar-expand-lg navbar-light fixed-top"
    id="mainNav"
    aria-label="Navegação principal"
  >

    <div class="container">

      <a
        class="navbar-brand d-flex align-items-center gap-2"
        href="../../index.html"
        aria-label="VivaLíngua - início"
      >

        <span class="brand-mark" aria-hidden="true">
          <i class="bi bi-book-half"></i>
        </span>

        <span>
          Viva<span class="brand-accent">Língua</span>
        </span>

      </a>


      <ul class="navbar-nav ms-auto align-items-lg-center">

        <li class="nav-item ms-lg-2" id="navLogin">

          <a class="nav-link" href="login.html">
            Entrar
          </a>

        </li>


        <li class="nav-item ms-lg-2 dropdown d-none" id="navUser">

          <button
            class="btn btn-nav dropdown-toggle d-flex align-items-center gap-2"
            type="button"
            id="navUserButton"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >

            <i class="bi bi-person-circle fs-5" id="navUserIcon"></i>

            <img id="navUserAvatar" class="nav-user-avatar d-none" alt="Avatar do usuário">

            <span id="navUserName">Minha conta</span>

          </button>


          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navUserButton">

            <li>

              <a class="dropdown-item" href="perfil.html">

                <i class="bi bi-person me-2"></i>

                Meu perfil

              </a>

            </li>


            <li><hr class="dropdown-divider"></li>


            <li>

              <a class="dropdown-item" href="#" id="navLogout">

                <i class="bi bi-box-arrow-right me-2"></i>

                Sair

              </a>

            </li>

          </ul>

        </li>

      </ul>

    </div>

  </nav>


  <!-- =========================
       CONTEÚDO PRINCIPAL
  ========================== -->

  <main id="conteudo">

    <section class="auth-section">

      <div class="container">

        <div class="row justify-content-center">

          <div class="col-md-8 col-lg-5">

            <div class="auth-card">

              <span class="section-kicker">
                Sua conta
              </span>

              <h1 class="auth-title">
                Editar informações
              </h1>


              <form id="editInfoForm" class="contribution-form" novalidate>

                <div class="mb-3">

                  <label for="editName" class="form-label">Nome</label>

                  <input id="editName" class="form-control" type="text">

                </div>


                <div class="mb-3">

                  <label for="editEmail" class="form-label">E-mail</label>

                  <input id="editEmail" class="form-control" type="email">

                </div>


                <div class="mb-3">

                  <label for="editPhone" class="form-label">Telefone</label>

                  <input id="editPhone" class="form-control" type="tel">

                </div>


                <div class="mb-3">

                  <label for="editCultura" class="form-label">Preferência de cultura</label>

                  <select id="editCultura" class="form-select">

                    <option value="">Selecione...</option>

                    <option>Hip-hop e música urbana</option>

                    <option>Sertanejo e cultura do interior</option>

                    <option>Nordestinidade e cordel</option>

                    <option>Cultura gaúcha</option>

                    <option>Índios e povos originários</option>

                    <option>MPB e música brasileira</option>

                  </select>

                </div>


                <button class="btn btn-primary-custom w-100" type="submit">

                  Salvar alterações

                </button>


                <a href="perfil.html" class="btn btn-nav w-100 mt-2">
                  Cancelar
                </a>


                <div id="editInfoFeedback" class="form-feedback mt-3 d-none" role="status"></div>

              </form>

            </div>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="footer">

    <div class="container">

      <div class="footer-bottom">

        <span>

          VivaLíngua ©

          <span id="currentYear"></span>

        </span>


        <span>

          Projeto acadêmico — Docente: Wanderson Timóteo

        </span>

      </div>

    </div>

  </footer>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>


  <script src="../js/auth.js"></script>

</body>

</html>
