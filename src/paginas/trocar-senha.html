<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Troque sua senha no VivaLíngua.">

  <meta name="theme-color" content="#476E63">

  <title>VivaLíngua | Trocar senha</title>


  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <link rel="preconnect" href="https://fonts.googleapis.com">


  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet">


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">


  <link rel="stylesheet" href="../css/style.css">

  <script>try{if(localStorage.getItem("vivalingua_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>

</head>


<body data-page="trocar">

  <a class="skip-link" href="#conteudo">
    Pular para o conteúdo
  </a>


  <!-- =========================
       NAVBAR
  ========================== -->

  <nav
    class="navbar navbar-expand-lg navbar-light fixed-top"
    id="mainNav"
    aria-label="Navegação principal"
  >

    <div class="container">

      <a
        class="navbar-brand d-flex align-items-center gap-2"
        href="../../index.html"
        aria-label="VivaLíngua - início"
      >

        <span class="brand-mark" aria-hidden="true">
          <i class="bi bi-book-half"></i>
        </span>

        <span>
          Viva<span class="brand-accent">Língua</span>
        </span>

      </a>


      <ul class="navbar-nav ms-auto align-items-lg-center">

        <li class="nav-item ms-lg-2" id="navLogin">

          <a class="nav-link" href="login.html">
            Entrar
          </a>

        </li>



          <li class="nav-item ms-lg-2">

            <button
              class="btn btn-nav"
              type="button"
              id="themeToggle"
              aria-label="Alternar tema claro/escuro"
            >

              <i class="bi bi-sun-fill" id="themeIcon"></i>

            </button>

          </li>        <li class="nav-item ms-lg-2 dropdown d-none" id="navUser">

          <button
            class="btn btn-nav dropdown-toggle d-flex align-items-center gap-2"
            type="button"
            id="navUserButton"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >

            <i class="bi bi-person-circle fs-5" id="navUserIcon"></i>

            <img id="navUserAvatar" class="nav-user-avatar d-none" alt="Avatar do usuário">

            <span id="navUserName">Minha conta</span>

          </button>


          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navUserButton">

            <li>

              <a class="dropdown-item" href="perfil.html">

                <i class="bi bi-person me-2"></i>

                Meu perfil

              </a>

            </li>

              <li>

                <a class="dropdown-item" href="historicos.html">

                  <i class="bi bi-clock-history me-2"></i>

                  Históricos

                </a>

              </li>


            <li><hr class="dropdown-divider"></li>


            <li>

              <a class="dropdown-item" href="#" id="navLogout">

                <i class="bi bi-box-arrow-right me-2"></i>

                Sair

              </a>

            </li>

          </ul>

        </li>

      </ul>

    </div>

  </nav>


  <!-- =========================
       CONTEÚDO PRINCIPAL
  ========================== -->

  <main id="conteudo">

    <section class="auth-section">

      <div class="container">

        <div class="row justify-content-center">

          <div class="col-md-8 col-lg-5">

            <div class="auth-card">

              <span class="section-kicker">
                Sua conta
              </span>

              <h1 class="auth-title">
                Trocar senha
              </h1>


              <form id="editPasswordForm" class="contribution-form" novalidate>

                <div class="mb-3">

                  <label for="currentPassword" class="form-label">Senha atual</label>

                  <div class="password-field">

                    <input id="currentPassword" class="form-control" type="password">

                    <button type="button" class="password-toggle" data-target="currentPassword" aria-label="Mostrar/ocultar senha"><i class="bi bi-eye"></i></button>

                  </div>


                  <a href="esqueci-senha.html" class="form-note d-block mt-1 text-end">

                    Esqueci minha senha

                  </a>

                </div>


                <div class="mb-3">

                  <label for="newPassword" class="form-label">Nova senha</label>

                  <div class="password-field">

                    <input id="newPassword" class="form-control" type="password">

                    <button type="button" class="password-toggle" data-target="newPassword" aria-label="Mostrar/ocultar senha"><i class="bi bi-eye"></i></button>

                  </div>

                </div>


                <div class="mb-3">

                  <label for="confirmNewPassword" class="form-label">Confirmar nova senha</label>

                  <div class="password-field">

                    <input id="confirmNewPassword" class="form-control" type="password">

                    <button type="button" class="password-toggle" data-target="confirmNewPassword" aria-label="Mostrar/ocultar senha"><i class="bi bi-eye"></i></button>

                  </div>

                </div>


                <button class="btn btn-primary-custom w-100" type="submit">

                  Atualizar senha

                </button>


                <a href="perfil.html" class="btn btn-nav w-100 mt-2">
                  Cancelar
                </a>


                <div id="editPasswordFeedback" class="form-feedback mt-3 d-none" role="status"></div>

              </form>

            </div>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="footer">

    <div class="container">

      <div class="footer-bottom">

        <span>

          VivaLíngua ©

          <span id="currentYear"></span>

        </span>


        <span>

          Projeto acadêmico — Docente: Wanderson Timóteo

        </span>

      </div>

    </div>

  </footer>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>


  <script src="../js/api.js"></script>

  <script src="../js/auth.js"></script>

</body>

</html>
