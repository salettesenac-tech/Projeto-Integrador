<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Seu perfil no VivaLíngua.">

  <meta name="theme-color" content="#476E63">

  <title>VivaLíngua | Meu perfil</title>


  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <link rel="preconnect" href="https://fonts.googleapis.com">


  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet">


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">


  <link rel="stylesheet" href="../css/style.css">

  <script>try{if(localStorage.getItem("vivalingua_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>

</head>


<body data-page="perfil">

  <a class="skip-link" href="#conteudo">
    Pular para o conteúdo
  </a>


  <!-- =========================
       NAVBAR
  ========================== -->

  <nav
    class="navbar navbar-expand-lg navbar-light fixed-top"
    id="mainNav"
    aria-label="Navegação principal"
  >

    <div class="container">

      <a
        class="navbar-brand d-flex align-items-center gap-2"
        href="../../index.html"
        aria-label="VivaLíngua - início"
      >

        <span class="brand-mark" aria-hidden="true">
          <i class="bi bi-book-half"></i>
        </span>

        <span>
          Viva<span class="brand-accent">Língua</span>
        </span>

      </a>


      <ul class="navbar-nav ms-auto align-items-lg-center">

        <li class="nav-item ms-lg-2" id="navLogin">

          <a class="nav-link" href="login.html">
            Entrar
          </a>

        </li>

          <li class="nav-item ms-lg-2"><button class="btn btn-nav" type="button" id="themeToggle" aria-label="Alternar tema claro/escuro"><i class="bi bi-sun-fill" id="themeIcon"></i></button></li>


        <li class="nav-item ms-lg-2 dropdown d-none" id="navUser">

          <button
            class="btn btn-nav dropdown-toggle d-flex align-items-center gap-2"
            type="button"
            id="navUserButton"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >

            <i class="bi bi-person-circle fs-5" id="navUserIcon"></i>

            <img id="navUserAvatar" class="nav-user-avatar d-none" alt="Avatar do usuário">

            <span id="navUserName">Minha conta</span>

          </button>


          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navUserButton">

            <li>

              <a class="dropdown-item" href="perfil.html">

                <i class="bi bi-person me-2"></i>

                Meu perfil

              </a>

            </li>

              <li>

                <a class="dropdown-item" href="historicos.html">

                  <i class="bi bi-clock-history me-2"></i>

                  Históricos

                </a>

              </li>


            <li><hr class="dropdown-divider"></li>


            <li>

              <a class="dropdown-item" href="#" id="navLogout">

                <i class="bi bi-box-arrow-right me-2"></i>

                Sair

              </a>

            </li>

          </ul>

        </li>

      </ul>

    </div>

  </nav>


  <!-- =========================
       CONTEÚDO PRINCIPAL
  ========================== -->

  <main id="conteudo">

    <section class="auth-section">

      <div class="container">

        <div class="row justify-content-center">

          <div class="col-md-8 col-lg-5">

            <div class="auth-card text-center">

              <div class="profile-avatar" aria-hidden="true" id="profileAvatar">
                <i class="bi bi-person-circle" id="profileAvatarIcon"></i>
              </div>

              <input
                type="file"
                id="avatarInput"
                accept="image/*"
                hidden
              >

              <button
                type="button"
                class="btn btn-nav btn-sm mb-3"
                id="changeAvatarBtn"
              >

                <i class="bi bi-camera me-1"></i>

                Mudar avatar

              </button>


              <div class="mt-3">

                <span class="section-kicker">
                  Sua conta
                </span>

              </div>

              <h1 class="auth-title" id="profileName">
                Perfil
              </h1>


              <div class="origin-box text-start mt-4">

                <div class="origin-icon">

                  <i class="bi bi-envelope-fill"></i>

                </div>


                <div>

                  <span>E-mail</span>

                  <strong id="profileEmail">—</strong>

                </div>

              </div>


              <div class="origin-box text-start mt-3">

                <div class="origin-icon">

                  <i class="bi bi-telephone-fill"></i>

                </div>


                <div>

                  <span>Telefone</span>

                  <strong id="profilePhone">—</strong>

                </div>

              </div>


              <div class="origin-box text-start mt-3">

                <div class="origin-icon">

                  <i class="bi bi-music-note-beamed"></i>

                </div>


                <div>

                  <span>Preferência de cultura</span>

                  <strong id="profileCultura">—</strong>

                </div>

              </div>


              <div class="origin-box text-start mt-3">

                <div class="origin-icon">

                  <i class="bi bi-calendar-check-fill"></i>

                </div>


                <div>

                  <span>Conta criada em</span>

                  <strong id="profileCreatedAt">—</strong>

                </div>

              </div>


              <div class="d-flex flex-column gap-2 mt-4">

                <a href="editar-perfil.html" class="btn btn-nav w-100">

                  <i class="bi bi-pencil me-1"></i>

                  Editar informações

                </a>


                <a href="trocar-senha.html" class="btn btn-nav w-100">

                  <i class="bi bi-key me-1"></i>

                  Trocar senha

                </a>

              </div>

<a href="../../index.html" class="btn btn-primary-custom w-100 mt-4">

                Voltar para o início

              </a>

            </div>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="footer">

    <div class="container">

      <div class="footer-bottom">

        <span>

          VivaLíngua ©

          <span id="currentYear"></span>

        </span>


        <span>

          Projeto acadêmico — Docente: Wanderson Timóteo

        </span>

      </div>

    </div>

  </footer>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>


  <script src="../js/auth.js"></script>

</body>

</html>
