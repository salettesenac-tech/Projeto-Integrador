<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Digite o código enviado.">

  <title>VivaLíngua | Digite o código</title>


  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <link rel="preconnect" href="https://fonts.googleapis.com">


  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet">


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">


  <link rel="stylesheet" href="../css/style.css">

  <script>try{if(localStorage.getItem("vivalingua_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>

</head>


<body>

  <a class="skip-link" href="#conteudo">
    Pular para o conteúdo
  </a>


  <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav" aria-label="Navegação principal">

    <div class="container">

      <a class="navbar-brand d-flex align-items-center gap-2" href="../../index.html" aria-label="VivaLíngua - início">

        <span class="brand-mark" aria-hidden="true">
          <i class="bi bi-book-half"></i>
        </span>

        <span>
          Viva<span class="brand-accent">Língua</span>
        </span>

      </a>

    </div>

  </nav>


  <main id="conteudo">

    <section class="auth-section">

      <div class="container">

        <div class="row justify-content-center">

          <div class="col-md-8 col-lg-5">

            <div class="auth-card">

              <span class="section-kicker">
                Recuperação de senha
              </span>

              <h1 class="auth-title">
                Digite o código
              </h1>

              <p class="auth-lead">

                Enviamos um código de verificação para <strong id="resetEmailLabel">seu e-mail</strong>.

              </p>

              <form id="resetForm" novalidate>

                <div class="mb-4">

                  <label for="resetCode" class="form-label">Código de verificação</label>

                  <input id="resetCode" class="form-control form-control-lg" type="text" maxlength="6" placeholder="000000">

                </div>

                <button class="btn btn-primary-custom w-100 btn-lg" type="submit">

                  Continuar

                </button>

                <a href="login.html" class="btn btn-nav w-100 mt-2">
                  Voltar para o login
                </a>

                <div id="resetFeedback" class="form-feedback mt-3 d-none" role="status"></div>

              </form>

            </div>

          </div>

        </div>

      </div>

    </section>

  </main>


  <footer class="footer">

    <div class="container">

      <div class="footer-bottom">

        <span>VivaLíngua © <span id="currentYear"></span></span>

        <span>Projeto acadêmico — Docente: Wanderson Timóteo</span>

      </div>

    </div>

  </footer>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>


  <script src="../js/auth.js"></script>

</body>

</html>
